<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
    <style>
      body { margin: 0; padding: 16px; }
      h2 { margin: 24px 0 8px; }
      .muted { opacity: 0.65; }
      .total { margin: 4px 0 16px; }
      table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
      th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid rgba(127, 127, 127, 0.2); vertical-align: top; }
      th { font-weight: 600; }
      td.num, th.num { text-align: right; white-space: nowrap; }
      .bar { height: 6px; border-radius: 3px; background: #1fb8cc; min-width: 2px; }
      .reason { opacity: 0.75; }
      .plan svg { width: 100%; height: auto; display: block; font-size: 11px; }
      .plan .grid { stroke: currentColor; stroke-opacity: 0.15; }
      .plan .day { stroke: currentColor; stroke-opacity: 0.4; stroke-dasharray: 3 3; }
      .plan text { fill: currentColor; fill-opacity: 0.7; }
      .plan .soc { fill: none; stroke: #1fb8cc; stroke-width: 2; }
      .plan .area { fill: #1fb8cc; fill-opacity: 0.12; }
      .plan .charge { fill: #2bb673; }
      .plan .discharge { fill: #f2994a; }
      .legend { display: flex; gap: 16px; flex-wrap: wrap; margin: 6px 0; }
      .export { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
      .export select, .export button { font: inherit; padding: 6px 10px; }
      .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
    </style>
  </head>
  <body>
    <h1 id="title" class="homey-title"></h1>
    <div id="root"><p class="muted">…</p></div>

    <h2 id="export_title"></h2>
    <div class="export">
      <select id="export_kind"><option value="sessions"></option><option value="days"></option></select>
      <button id="export_download" class="homey-button-secondary-shadow"></button>
      <button id="export_copy" class="homey-button-secondary-shadow"></button>
    </div>
    <p id="export_status" class="muted"></p>

    <script type="text/javascript">
      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
        }[c]));
      }

      let UNIT = 'kr';

      function kr(v) {
        const n = Number(v || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        return UNIT === '€' ? `€${n}` : `${n} ${UNIT}`;
      }

      // Sessions per local day, newest first (the same as perDay in lib/history.js).
      function perDay(sessions) {
        const days = new Map();
        for (const x of sessions) {
          const d = days.get(x.date) || { date: x.date, reward: 0, sessions: 0, minutes: 0 };
          d.reward = Math.round((d.reward + x.reward) * 100) / 100;
          d.sessions += 1;
          d.minutes += x.minutes;
          days.set(x.date, d);
        }
        return [...days.values()].sort((p, q) => (p.date < q.date ? 1 : -1));
      }

      // filter: '' for all sessions, or a car/battery name (#69).
      function renderHome(home, L, filter = '') {
        UNIT = home.unit || 'kr';
        if (!home.sessions.length) {
          return `<h2>${esc(home.name)}</h2><p class="muted">${esc(L.empty)}</p>`;
        }
        const list = filter ? home.sessions.filter((x) => x.devices.includes(filter)) : home.sessions;
        const daysList = filter ? perDay(list) : home.days;
        const total = Math.round(list.reduce((sum, x) => sum + x.reward, 0) * 100) / 100;
        const max = Math.max(...daysList.map((d) => d.reward), 0.01);
        const days = daysList.map((d) => `
          <tr>
            <td>${esc(d.date)}</td>
            <td class="num">${kr(d.reward)}</td>
            <td class="num">${d.sessions}</td>
            <td class="num">${d.minutes} ${esc(L.min)}</td>
            <td style="width:30%"><div class="bar" style="width:${Math.round((d.reward / max) * 100)}%"></div></td>
          </tr>`).join('');
        const withDevices = home.devices && home.devices.length;
        const sessions = list.map((x) => `
          <tr>
            <td>${esc(x.when)}</td>
            <td class="num">${kr(x.reward)}${x.settled ? `<div class="muted" title="${esc(L.settled)}">+${kr(x.settled)} · ${x.settledAfter} s</div>` : ''}</td>
            <td class="num">${x.minutes} ${esc(L.min)}</td>
            ${withDevices ? `<td>${esc(x.devices.join(' + ') || '–')}</td>` : ''}
            <td class="reason">${esc(x.reasonText || '–')}</td>
          </tr>`).join('');
        const picker = withDevices ? `
          <p><select class="device-filter" data-home="${esc(home.id)}">
            <option value="">${esc(L.all_devices)}</option>
            ${home.devices.map((d) => `<option value="${esc(d)}"${d === filter ? ' selected' : ''}>${esc(d)}</option>`).join('')}
          </select></p>` : '';
        const records = (home.records || []).length ? `
          <h3>${esc(L.records)}</h3>
          <table>
            ${home.records.map((r) => r.items.map((x, i) => `
              <tr>
                <td>${i === 0 ? esc(r.name) : ''}</td>
                <td>${esc(x.label)}</td>
                <td class="num">${x.minutes ? `${x.value} ${esc(L.min)}` : kr(x.value)}</td>
                <td class="muted">${esc(x.when)}</td>
              </tr>`).join('')).join('')}
          </table>` : '';
        const reasons = (home.reasons || []).map((m) => `
          <h3>${esc(L.reasons_title)} – ${esc(m.label)}</h3>
          <table>
            <thead><tr><th>${esc(L.reason)}</th><th class="num">${esc(L.sessions)}</th>
              <th class="num">${esc(L.reward)}</th><th class="num">${esc(L.duration)}</th></tr></thead>
            <tbody>${m.rows.map((r) => `
              <tr>
                <td>${esc(r.text)}</td>
                <td class="num">${r.sessions} (${r.sessionShare} %)</td>
                <td class="num">${kr(r.reward)} (${r.rewardShare} %)</td>
                <td class="num">${r.minutes} ${esc(L.min)}</td>
              </tr>`).join('')}</tbody>
          </table>`).join('');
        return `
          <h2>${esc(home.name)}</h2>
          ${picker}
          <p class="total muted">${esc(L.total)}: ${kr(total)} · ${list.length} ${esc(L.sessions_count)}</p>
          <h3>${esc(L.per_day)}</h3>
          <table>
            <thead><tr><th></th><th class="num">${esc(L.reward)}</th><th class="num">${esc(L.sessions)}</th>
              <th class="num">${esc(L.duration)}</th><th></th></tr></thead>
            <tbody>${days}</tbody>
          </table>
          <h3>${esc(L.sessions)}</h3>
          <table>
            <thead><tr><th>${esc(L.when)}</th><th class="num">${esc(L.reward)}</th>
              <th class="num">${esc(L.duration)}</th>${withDevices ? `<th>${esc(L.device)}</th>` : ''}<th>${esc(L.reason)}</th></tr></thead>
            <tbody>${sessions}</tbody>
          </table>
          ${reasons}
          ${records}`;
      }

      // Battery plan (#15): the curve comes as an SVG from the API (lib/planChart.js).
      function renderPlan(b, L) {
        const head = `<h2>${esc(b.name)}</h2><h3>${esc(L.plan_title)}</h3>`;
        if (!b.svg) return `${head}<p class="muted">${esc(L.plan_empty)}</p>`;
        const legend = `<div class="legend muted"><span><i style="background:#1fb8cc"></i>${esc(L.plan_soc)}</span>
          <span><i style="background:#2bb673"></i>${esc(L.plan_charge)}</span>
          <span><i style="background:#f2994a"></i>${esc(L.plan_discharge)}</span></div>`;
        const note = `<p class="muted">${esc(L.plan_note)}${b.updated ? ` (${esc(b.updated)})` : ''}</p>`;
        return `${head}<div class="plan">${b.svg}</div>${legend}${note}${renderBatteryDays(b, L)}`;
      }

      // The battery's day (#29, #48): hours per reason, energy in and out, savings.
      function renderBatteryDays(b, L) {
        if (!b.days || !b.days.length) return '';
        UNIT = b.unit || 'kr';
        const h = (v) => (typeof v === 'number' ? v.toLocaleString(undefined, { maximumFractionDigits: 1 }) : '–');
        const k = (v) => (typeof v === 'number' ? v.toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 }) : '–');
        const rows = b.days.map((d) => `
          <tr>
            <td>${esc(d.today ? L.today : d.date)}</td>
            <td class="num">${h(d.hours && d.hours.gridRewards)} h</td>
            <td class="num">${h(d.hours && d.hours.price)} h</td>
            <td class="num">${h(d.hours && d.hours.solar)} h</td>
            <td class="num">${k(d.kwh && d.kwh.charged)}</td>
            <td class="num">${k(d.kwh && d.kwh.discharged)}</td>
            <td class="num">${typeof d.savings === 'number' ? kr(d.savings) : '–'}</td>
          </tr>`).join('');
        return `
          <h3>${esc(L.battery_days)}</h3>
          <table>
            <thead><tr><th></th><th class="num">${esc(L.bd_gr)}</th><th class="num">${esc(L.bd_price)}</th>
              <th class="num">${esc(L.bd_solar)}</th><th class="num">${esc(L.bd_charged)} (kWh)</th>
              <th class="num">${esc(L.bd_discharged)} (kWh)</th><th class="num">${esc(L.bd_savings)}</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>`;
      }

      // Export (#10). Downloading does not work in every Homey app, so copying is offered too.
      function setupExport(Homey, L) {
        const $ = (id) => document.getElementById(id);
        $('export_title').textContent = L.export_title;
        $('export_kind').options[0].textContent = L.export_sessions;
        $('export_kind').options[1].textContent = L.export_days;
        $('export_download').textContent = L.export_download;
        $('export_copy').textContent = L.export_copy;
        const status = (t) => { $('export_status').textContent = t; };
        const fetchCsv = () => new Promise((resolve, reject) => {
          Homey.api('GET', `/export?kind=${encodeURIComponent($('export_kind').value)}`, null,
            (err, data) => (err ? reject(err) : resolve(data)));
        });
        const fail = (err) => status(err && err.message ? err.message : String(err));

        $('export_download').addEventListener('click', () => fetchCsv().then((d) => {
          if (!d.rows) { status(L.export_empty); return; }
          const a = document.createElement('a');
          a.href = URL.createObjectURL(new Blob([d.csv], { type: 'text/csv;charset=utf-8' }));
          a.download = d.filename;
          document.body.appendChild(a);
          a.click();
          a.remove();
          status(`${d.filename} · ${d.rows} ${L.export_rows}`);
        }).catch(fail));

        $('export_copy').addEventListener('click', () => fetchCsv().then(async (d) => {
          if (!d.rows) { status(L.export_empty); return; }
          const text = d.csv.replace(/^﻿/, '');
          try {
            await navigator.clipboard.writeText(text);
          } catch (err) {
            // Older web views: copy through a hidden text field.
            const t = document.createElement('textarea');
            t.value = text;
            document.body.appendChild(t);
            t.select();
            const ok = document.execCommand('copy');
            t.remove();
            if (!ok) throw new Error(L.export_copy_failed);
          }
          status(`${L.export_copied} · ${d.rows} ${L.export_rows}`);
        }).catch(fail));
      }

      function onHomeyReady(Homey) {
        Homey.api('GET', '/history', null, (err, data) => {
          const root = document.getElementById('root');
          if (err) {
            root.innerHTML = `<p>${esc(err.message || err)}</p>`;
          } else {
            const L = data.labels;
            document.getElementById('title').textContent = L.title;
            setupExport(Homey, L);
            root.innerHTML = (data.homes.length
              ? data.homes.map((h, i) => `<section id="home-${i}">${renderHome(h, L)}</section>`).join('')
              : `<p class="muted">${esc(L.no_home)}</p>`)
              + (data.batteries || []).map((b) => renderPlan(b, L)).join('');
            root.addEventListener('change', (e) => {
              if (!e.target.classList.contains('device-filter')) return;
              const i = data.homes.findIndex((h) => h.id === e.target.dataset.home);
              if (i >= 0) document.getElementById(`home-${i}`).innerHTML = renderHome(data.homes[i], L, e.target.value);
            });
          }
          Homey.ready();
        });
      }
    </script>
  </body>
</html>
